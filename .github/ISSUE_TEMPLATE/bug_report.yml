name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        **Privacy warning:** Do not upload real resumes, contact details, employer/store/brand names, ASIN/SKU, internal business data, screenshots, credentials, or lightly anonymized copies. Use a minimal synthetic example.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Provide steps and fictional input sufficient to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no real candidate or confidential business data.
          required: true
